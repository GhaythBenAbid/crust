[package]
name = "crust"
version = "0.1.0"
edition = "2024"

[dependencies]
httparse = "1.10.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
